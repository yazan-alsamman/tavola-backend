# Mounted over /etc/nginx/conf.d/default.conf in the official nginx image -
# the base image's own nginx.conf already `include`s this directory, so
# nothing else needs to be replaced.

upstream backend_upstream {
    # Docker's embedded DNS resolves the "backend" service name to its
    # current container IP over the internal network defined in
    # docker-compose.yml - no hardcoded IPs.
    server backend:3000;
}

# gzip - applies to every server block below
gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_vary on;
gzip_types
    application/json
    application/javascript
    text/css
    text/plain
    text/xml
    application/xml;

server {
    listen 80;
    server_name _;

    # Security headers (NON_FUNCTIONAL_REQUIREMENTS.md's Security section).
    # Strict-Transport-Security is intentionally omitted here - it only
    # makes sense once TLS terminates at this proxy; see the commented HTTPS
    # template below for where it belongs.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 10m;

    # WebSocket / Socket.IO (ADR-015) - Engine.IO's default handshake path.
    location /socket.io/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;
    }
}
