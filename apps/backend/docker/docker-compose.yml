# Base, production-shaped stack. Run alone (no override) for a
# production-style deployment: variables come from whatever --env-file is
# passed (see ENVIRONMENT_SETUP.md) or from the orchestrator's own secret
# injection - never from a committed file.
#
# Invocation (from this directory):
#   docker compose -f docker-compose.yml --env-file ../.env.production up -d
#
# Local development instead runs this file WITH docker-compose.override.yml
# (Compose auto-merges override.yml when both files sit in the same cwd):
#   docker compose --env-file ../.env.development up

name: tavla

networks:
  tavla-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # C.UTF-8 is chosen (not en_US.UTF-8) because Alpine's musl libc does
      # not ship full glibc locale data - C.UTF-8 gives UTF-8 encoding
      # without depending on a locale package that may not exist.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [tavla-network]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [tavla-network]
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [tavla-network]
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/create-buckets.sh"]
    volumes:
      - ./minio/create-buckets.sh:/create-buckets.sh:ro
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PUBLIC_BUCKET: ${MINIO_PUBLIC_BUCKET}
      MINIO_PRIVATE_BUCKET: ${MINIO_PRIVATE_BUCKET}
    networks: [tavla-network]
    restart: "no"

  backend:
    build:
      context: ../../..
      dockerfile: apps/backend/docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      API_VERSION: ${API_VERSION}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_POOL_MODE: ${DATABASE_POOL_MODE}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS}
      REDIS_URL: ${REDIS_URL}
      REDIS_CACHE_DB_INDEX: ${REDIS_CACHE_DB_INDEX}
      REDIS_QUEUE_DB_INDEX: ${REDIS_QUEUE_DB_INDEX}
      REDIS_SOCKET_ADAPTER_DB_INDEX: ${REDIS_SOCKET_ADAPTER_DB_INDEX}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_PUBLIC_PORT: ${MINIO_PUBLIC_PORT}
      MINIO_PUBLIC_USE_SSL: ${MINIO_PUBLIC_USE_SSL}
      MINIO_PUBLIC_BUCKET: ${MINIO_PUBLIC_BUCKET}
      MINIO_PRIVATE_BUCKET: ${MINIO_PRIVATE_BUCKET}
      MINIO_SIGNED_URL_EXPIRY_SECONDS: ${MINIO_SIGNED_URL_EXPIRY_SECONDS}
      LOG_LEVEL: ${LOG_LEVEL}
      CORRELATION_ID_HEADER: ${CORRELATION_ID_HEADER}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY}
      ARGON2_MEMORY_COST: ${ARGON2_MEMORY_COST}
      ARGON2_TIME_COST: ${ARGON2_TIME_COST}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM}
      PLATFORM_ADMIN_JWT_SECRET: ${PLATFORM_ADMIN_JWT_SECRET}
      PLATFORM_ADMIN_JWT_ISSUER: ${PLATFORM_ADMIN_JWT_ISSUER:-tavla-platform-admin}
      PLATFORM_ADMIN_JWT_AUDIENCE: ${PLATFORM_ADMIN_JWT_AUDIENCE:-tavla-platform-admin-clients}
      PLATFORM_ADMIN_JWT_EXPIRY_SECONDS: ${PLATFORM_ADMIN_JWT_EXPIRY_SECONDS:-900}
      FONNTE_API_TOKEN: ${FONNTE_API_TOKEN:-}
      FONNTE_API_URL: ${FONNTE_API_URL:-https://api.fonnte.com/send}
      FONNTE_REQUEST_TIMEOUT_MS: ${FONNTE_REQUEST_TIMEOUT_MS:-10000}
    networks: [tavla-network]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend
    ports:
      - "${NGINX_HOST_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [tavla-network]
    restart: unless-stopped
