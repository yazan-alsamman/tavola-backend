# Persistence and general server tuning only. `requirepass` and `maxmemory`
# are deliberately NOT set here - a static conf file can't read the
# REDIS_PASSWORD/REDIS_MAXMEMORY environment variables, so both are passed on
# the command line via docker-compose.yml's `command:` override instead (see
# ARCHITECTURE.md's Database Strategy: Redis is not the persistent source of
# truth, but ADR-004 still requires it survive a restart for queue/session
# data).
#
# maxmemory-policy stays `noeviction`: Redis here backs BullMQ queues and
# sessions, where silently evicting a key (as allkeys-lru would) means a
# silently dropped job or session. With noeviction, once REDIS_MAXMEMORY is
# reached, writes fail loudly (OOM error) instead of losing data quietly.

# RDB snapshotting - point-in-time backups
save 900 1
save 300 10
save 60 10000

# AOF - durability between snapshots
appendonly yes
appendfsync everysec
appendfilename "tavla.aof"
appenddirname "aof"

dir /data

maxmemory-policy noeviction
