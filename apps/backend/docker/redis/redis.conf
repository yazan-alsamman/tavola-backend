# Persistence and general server tuning only. `requirepass` is deliberately
# NOT set here - a static conf file can't read the REDIS_PASSWORD
# environment variable, so the password is passed on the command line via
# docker-compose.yml's `command:` override instead (see ARCHITECTURE.md's
# Database Strategy: Redis is not the persistent source of truth, but ADR-004
# still requires it survive a restart for queue/session data).

# RDB snapshotting - point-in-time backups
save 900 1
save 300 10
save 60 10000

# AOF - durability between snapshots
appendonly yes
appendfsync everysec
appendfilename "tavla.aof"
appenddirname "aof"

dir /data

maxmemory-policy noeviction
